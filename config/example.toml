# No password, token, or authenticated RTSP URI belongs in this file.
data_dir = "/var/lib/shore-tracker"

[camera]
rotation_degrees = 0
preview_fps = 20
interface = "enP8p1s0"
rtsp_uri_env = "SHORE_TRACKER_RTSP_URI"
codec = "h265"
latency_ms = 250

[inference]
max_fps = 0.0
enabled = true
backend = "tensorrt"
detector_model = "/var/lib/shore-tracker/models/surfer_fcos_raw.onnx"
action_model = "/var/lib/shore-tracker/models/actions_mobilenet_v3_small.onnx"
engine_dir = "/var/lib/shore-tracker/models/engines"
score_threshold = 0.50
confirmation_frames = 3

[recording]
root = "/var/lib/shore-tracker/recordings"
segment_seconds = 600
free_warning_gib = 120
free_stop_gib = 100
record_audio = false

[servo]
# RS485 雲台: Moxa R+/R−, Pelco-D 9600 8N1, address 001.
# Keep disabled until camera-axis direction is physically calibrated.
enabled = false
transport = "serial"
protocol = "pelco_d"
serial_device = "/dev/serial/by-id/usb-Moxa_Technologies_Co.__Ltd._UPort_1130-if00-port0"
serial_baud = 9600
send_hz = 20
pelco_address = 1
pelco_pan_speed = 8
pelco_tilt_speed = 8
pan_gain_deg = 45.0 # Compatibility name: dimensionless sensitivity for Pelco-D.
pan_deadband = 0.20
pan_direction = 0 # Set +1/-1 only after checking camera-to-head direction.
tilt_enabled = false
tilt_direction = 0

[tracking]
chasing_threshold = 0.70
takeoff_threshold = 0.65
surfing_threshold = 0.70
candidate_hold_seconds = 0.50
finished_hold_seconds = 2.00
ride_exit_seconds = 5.00
frame_stale_seconds = 1.50

[zoom]
enabled = true
maximum = 2.5
target_box_height = 0.28
edge_margin = 0.18
fast_target_speed = 0.35
slow_inference_seconds = 0.35
zoom_in_per_second = 0.35
zoom_out_per_second = 4.0

[web]
host = "127.0.0.1"
port = 80
preview_stale_seconds = 2.0
