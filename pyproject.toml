[build-system]
requires = ["setuptools>=67"]
build-backend = "setuptools.build_meta"

[project]
name = "shore-tracker"
version = "0.1.0"
description = "Shore Jetson surf tracking and recording"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<13", "pyserial>=3.5,<4"]

[project.optional-dependencies]
test = ["pytest>=7.2"]

[project.scripts]
shore-tracker = "shore_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["shore_tracker*"]

[tool.setuptools.package-data]
"shore_tracker.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
